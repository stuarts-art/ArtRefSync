[project]
name = "artrefsync"
version = "1.1.0"
description = "Tool to sync reference images from major image board sites given a list of artist names."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dacite>=1.9.2",
    "dataclassdb>=0.1.5",
    "diskcache>=5.6.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.0.0",
    "requests>=2.32.3",
    "requests-ratelimiter>=0.10.0",
    "simple-toml-configurator>=1.3.0",
    "sortedcontainers>=2.4.0",
    "tenacity>=9.1.4",
    "tkinterdnd2>=0.4.3",
    "ttkbootstrap>=1.19.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[project.scripts]
sync_cli = "artrefsync.cli:ui"
